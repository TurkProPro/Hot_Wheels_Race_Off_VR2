<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels VR - 1:64 RC Car & Grab</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.85); padding: 15px 25px;
            border-radius: 8px; font-size: 15px; text-align: center; z-index: 10;
            border: 1px solid #555; pointer-events: none;
        }
    </style>

    <!-- Three.js, GLTFLoader, Cannon.js ve WebXR VRButton -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>
    <div id="info">Meta Quest 3 VR | Grip Tuşu: Arabayı Tut / Bırak | Sağ Trigger: İleri | Sol Joystick: Yön</div>

    <script>
        let camera, scene, renderer;
        let world, carBody, carMesh = null;
        let controllers = [];
        
        // Etkileşim ve Sürüş Değişkenleri
        let isGrabbed = false;
        let grabbedController = null;
        let throttle = 0;
        let steering = 0;

        init();
        animate();

        function init() {
            // 1. Sahne ve Kamera Kurulumu
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            // Quest 3 için yer (local-floor) referans alanı sabitleme
            renderer.xr.addEventListener('sessionstart', () => {
                const session = renderer.xr.getSession();
                session.requestReferenceSpace('local-floor').then((refSpace) => {
                    renderer.xr.setReferenceSpace(refSpace);
                });
            });

            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Işıklandırma
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(2, 5, 2);
            scene.add(dirLight);

            // 2. Fizik Dünyası (Cannon.js)
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            // Gerçek dünya zemini (LocalFloor) için Cannon Plane
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.add(groundBody);

            // 3. Kontrolcüler ve Elde Tutma (Grab) Sistemi
            setupControllers();

            // 4. Hot Wheels Arabayı Yükle ve 1:64 Ölçeklendir
            loadHotWheelsCar();

            window.addEventListener('resize', onWindowResize);
        }

        function loadHotWheelsCar() {
            // Başlangıçta fiziksel gövde (1:64 gerçek ölçüleri: ~7cm uzunluk, ~3cm genişlik, ~2cm yükseklik)
            const carShape = new CANNON.Box(new CANNON.Vec3(0.015, 0.01, 0.035));
            carBody = new CANNON.Body({ mass: 0.05 }); // 50 gram RC araba kütlesi
            carBody.addShape(carShape);
            carBody.position.set(0, 0.05, -0.5); // Kullanıcının hemen önünde local-floor üzerinde spawn
            world.add(carBody);

            // hot_wheels_unleashed.glb modelini yükle
            const loader = new THREE.GLTFLoader();
            loader.load('models/assets/hot_wheels_unleashed.glb', (gltf) => {
                carMesh = gltf.scene;
                
                // Modelin orijinal boyutundan bağımsız olarak tam 1:64 (0.07 metre / 7 cm uzunluk) olacak şekilde otomatik ölçekleme
                const box = new THREE.Box3().setFromObject(carMesh);
                const size = new THREE.Vector3();
                box.getSize(size);
                const targetLength = 0.07; // 7 cm
                const scaleFactor = targetLength / Math.max(size.x, size.y, size.z);
                carMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

                scene.add(carMesh);
            }, undefined, (error) => {
                console.error("hot_wheels_unleashed.glb yüklenemedi! Dosya yolunu veya adını kontrol et.", error);
                // Yedek görsel kutu
                const geom = new THREE.BoxGeometry(0.03, 0.02, 0.07);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                carMesh = new THREE.Mesh(geom, mat);
                scene.add(carMesh);
            });
        }

        function setupControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                
                controller.addEventListener('connected', (event) => {
                    controller.gamepad = event.data.gamepad;
                    controller.handedness = event.data.handedness;
                });

                // Grip (Yan tuş / Squeeze) ile aracı ele alma ve bırakma
                controller.addEventListener('squeezestart', () => {
                    if (carMesh && !isGrabbed) {
                        const distance = controller.position.distanceTo(carMesh.position);
                        if (distance < 0.35) { // Araca yakınsa eline al
                            isGrabbed = true;
                            grabbedController = controller;
                            carBody.mass = 0; // Eldeyken fizik etkimesin
                            carBody.velocity.set(0, 0, 0);
                            carBody.angularVelocity.set(0, 0, 0);
                        }
                    } else if (isGrabbed && grabbedController === controller) {
                        // Elindeyken bırak
                        releaseCar();
                    }
                });

                scene.add(controller);
                controllers.push(controller);
            }
        }

        function releaseCar() {
            isGrabbed = false;
            carBody.mass = 0.05; // Fizik kütlesini geri yükle
            if (grabbedController) {
                // Controller hızını araca aktararak fırlatabilme imkanı
                carBody.position.copy(grabbedController.position);
            }
            grabbedController = null;
        }

        function handleInput() {
            throttle = 0;
            steering = 0;

            controllers.forEach((controller) => {
                if (!controller.gamepad) return;
                const gp = controller.gamepad;

                // Sağ kontrolör: Trigger -> İleri
                if (controller.handedness === 'right') {
                    const triggerVal = gp.buttons[0] ? gp.buttons[0].value : 0;
                    if (triggerVal > 0.05) throttle += triggerVal * 3.5;
                }

                // Sol kontrolör: Joystick X ekseni -> Sağa/Sola Dönüş (Steering)
                if (controller.handedness === 'left') {
                    if (gp.axes.length >= 2) {
                        steering = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
                    }
                }
            });
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            handleInput();

            if (isGrabbed && grabbedController && carMesh) {
                // Araba elde tutuluyorsa kontrolcünün pozisyonunu ve rotasyonunu birebir takip etsin
                carMesh.position.copy(grabbedController.position);
                carMesh.quaternion.copy(grabbedController.quaternion);
                carBody.position.copy(carMesh.position);
                carBody.quaternion.copy(carMesh.quaternion);
            } else {
                // Fizik simülasyonunu çalıştır
                world.step(1 / 60);

                const forwardDir = new CANNON.Vec3(0, 0, -1);
                carBody.quaternion.vmult(forwardDir, forwardDir);

                // İleri itki kuvveti ve direksiyon dönüşü
                carBody.applyForce(new CANNON.Vec3(forwardDir.x * throttle, 0, forwardDir.z * throttle), carBody.position);
                carBody.angularVelocity.y = -steering * 5.0;

                // Görsel modeli fizik gövdesiyle senkronize et
                if (carMesh) {
                    carMesh.position.copy(carBody.position);
                    carMesh.quaternion.copy(carBody.quaternion);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
