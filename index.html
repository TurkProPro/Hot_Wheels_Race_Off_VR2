<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels Unleashed - 3D Sahne</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            pointer-events: none;
        }
    </style>

    <!-- Import Maps: Three.js ve eklentileri için modern modül yapısı -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Modeller Yükleniyor...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // 1. Sahne, Kamera ve Render Yöneticisi
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            75, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Kamera Kontrolleri (Fare ile Döndürme/Yakınlaşma)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Aydınlatma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 4. Adaptörler ve Yükleyiciler (GLTF/GLB + DRACO Decoder Adaptörü)
        const gltfLoader = new GLTFLoader();
        
        // Draco Adaptörü: Sıkıştırılmış .glb dosyalarını çözmek için gerekli
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        gltfLoader.setDRACOLoader(dracoLoader);

        // 5. Model Yükleme İşlemleri
        const loadingEnum = { count: 0 };
        const checkLoading = () => {
            loadingEnum.count++;
            if (loadingEnum.count === 2) {
                document.getElementById('loading').style.display = 'none';
            }
        };

        // Araba Modeli Yükleme (.glb)
        let carMesh;
        gltfLoader.load(
            'assets/models/hot_wheels_unleashed.glb',
            (gltf) => {
                carMesh = gltf.scene;
                
                // Tinkercad / GLB modelleri için ölçek ve konum ayarı
                carMesh.scale.set(0.1, 0.1, 0.1); 
                carMesh.position.set(0, 0.5, 0);
                
                carMesh.traverse((child) => {
                    if (child.isMesh) child.castShadow = true;
                });

                scene.add(carMesh);
                checkLoading();
            },
            (xhr) => console.log(`Araba: ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`),
            (error) => console.error('Araba yüklenirken hata oluştu:', error)
        );

        // Yol Modeli Yükleme (.glb)
        let roadMesh;
        gltfLoader.load(
            'assets/models/hwro_old_new_road.glb',
            (gltf) => {
                roadMesh = gltf.scene;
                
                roadMesh.position.set(0, 0, 0);
                roadMesh.traverse((child) => {
                    if (child.isMesh) child.receiveShadow = true;
                });

                scene.add(roadMesh);
                checkLoading();
            },
            (xhr) => console.log(`Yol: ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`),
            (error) => console.error('Yol yüklenirken hata oluştu:', error)
        );

        // 6. Ekran Boyutu Değişimi Kontrolü
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Animasyon Döngüsü (Render Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
