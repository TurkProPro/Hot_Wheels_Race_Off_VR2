<html lang="tr">
<head>
<meta charset="UTF-8">

<style>body{margin:0;overflow:hidden;background:#000} #info{position:absolute;color:white;top:10px;width:100%;text-align:center;font-family:sans-serif;z-index:10}</style>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
}
</script>
</head>
<body>
<div id="info">X=Yol Y=Adaptör A=Işınla/Kilitle B=Dummy</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as CANNON from 'cannon-es';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
scene.add(new THREE.HemisphereLight(0xffffff, 0x444, 1.5));

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.addBody(new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI / 2, 0, 0) }));

let playerCar, playerVehicle, dummyCars = [], tracks = [], adapters = [];
let carModelTemplate = null, trackModelTemplate = null;
let lastButtons = { x: false, y: false, a: false, b: false };

const loader = new GLTFLoader();
const BASE_URL = 'https://raw.githubusercontent.com/TurkPro/Hot_Wheels_Race_Off_VR2/main/';

// --- DOĞRU PATHLER ---
// Araba: assets/models/ içinde "unleashed" geçen dosya
loader.load(BASE_URL + 'assets/models/unleashed_car.glb', (gltf) => {
    carModelTemplate = gltf.scene;
    spawnPlayerCar();
}, undefined, (e)=>{ console.error("Araba yüklenemedi", e) });

// Yol: assets/models/old_new_road.glb
loader.load(BASE_URL + 'assets/models/old_new_road.glb', (gltf) => {
    trackModelTemplate = gltf.scene;
}, undefined, (e)=>{ console.error("Yol yüklenemedi", e) });

function spawnPlayerCar(){
    if(!carModelTemplate) return;
    playerCar = carModelTemplate.clone();
    playerCar.scale.set(0.05, 0.05, 0.05);
    scene.add(playerCar);
    const chassisBody = new CANNON.Body({ mass: 5, shape: new CANNON.Box(new CANNON.Vec3(0.15, 0.05, 0.3)) });
    chassisBody.position.set(0, 0.5, -1);
    world.addBody(chassisBody);
    playerVehicle = new CANNON.RaycastVehicle({ chassisBody });
    [[-0.15,0.25],[0.15,0.25],[-0.15,-0.25],[0.15,-0.25]].forEach((p)=>{
        playerVehicle.addWheel({radius:0.05, directionLocal:new CANNON.Vec3(0,-1,0), chassisConnectionPointLocal:new CANNON.Vec3(p[0],-0.02,p[1])});
    });
    playerVehicle.addToWorld(world);
}

function spawnDummyCar(){
    if(!carModelTemplate) return;
    const mesh = carModelTemplate.clone(); mesh.scale.set(0.05,0.05,0.05); scene.add(mesh);
    const body = new CANNON.Body({ mass: 3, shape: new CANNON.Box(new CANNON.Vec3(0.15, 0.05, 0.3)) });
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    body.position.copy(camera.position.clone().add(dir.multiplyScalar(0.5)));
    world.addBody(body);
    dummyCars.push({mesh, body, speed: 2 + Math.random()*2});
}

    const mesh = trackModelTemplate? trackModelTemplate.clone() : new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.01, 0.4), new THREE.MeshStandardMaterial({color:0xff5500}));
    mesh.scale.set(0.1,0.1,0.1); mesh.position.copy(pos); scene.add(mesh);
    const body = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.04, 0.005, 0.2)) });
    body.position.copy(pos); world.addBody(body);
