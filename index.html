<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels Race Off VR - Full Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info-overlay {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.75); padding: 10px 20px;
            border-radius: 8px; font-size: 14px; pointer-events: none; text-align: center;
            z-index: 10;
        }
    </style>

    <!-- Three.js ve Fizik Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>
    <div id="info-overlay">Hot Wheels Quest 3 | Sağ Trigger: İleri | Sağ Grip: Geri | Sol Joystick: Yön | Menü Tuşu: Pist Seçimi</div>

    <script>
        let camera, scene, renderer;
        let world, carBody, carMesh;
        let controllers = [];
        
        // Kontrol Değişkenleri
        let throttle = 0;
        let steering = 0;

        // Pist Listesi ve Dosya Adları
        const tracks = [
            { name: "Yeni Yol (Road)", file: "models/assets/hwrovr_old_new_road.glb" },
            { name: "Adaptör Parkuru", file: "models/assets/hwrovr_old_adapter.glb" }
        ];
        let currentTrackMesh = null;
        let currentTrackBody = null;

        // VR Menü Değişkenleri
        let menuMesh, menuTexture, menuCtx;
        let menuVisible = false;
        let selectedTrackIndex = 0;

        init();
        animate();

        function init() {
            // 1. Sahne ve Kamera Kurulumu
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b16);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Işıklandırma
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(2, 5, 2);
            scene.add(dirLight);

            // 2. Fizik Motoru (Cannon.js) Başlatma
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            // LocalFloor Taban Zemin Çarpışması
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.add(groundBody);

            // 3. 1:64 Ölçekli Gerçekçi Hot Wheels RC Araba Oluşturma
            createHotWheelsCar();

            // 4. VR Kontrolcüler ve Menü Sistemi
            setupControllers();
            createVRMenu();

            // 5. İlk Pisti Yükle
            loadTrack(selectedTrackIndex);

            window.addEventListener('resize', onWindowResize);
        }

        function createHotWheelsCar() {
            // Gerçek 1:64 Hot Wheels Ölçüleri (~7cm uzunluk, ~3cm genişlik, ~2cm yükseklik)
            const carShape = new CANNON.Box(new CANNON.Vec3(0.015, 0.01, 0.035));
            carBody = new CANNON.Body({ mass: 0.06 }); // 60 gram RC araba kütlesi
            carBody.addShape(carShape);
            carBody.position.set(0, 0.05, -0.6); // LocalFloor üstünde tam spawn noktası
            world.add(carBody);

            // Geçici Gövde Kutusu (Model yüklenene kadar görünür)
            const geom = new THREE.BoxGeometry(0.03, 0.02, 0.07);
            const mat = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.5, roughness: 0.2 });
            carMesh = new THREE.Mesh(geom, mat);
            scene.add(carMesh);

            // hot_wheels_unleashed.glb modelini yükle ve 1:64 oranına ölçekle
            const loader = new THREE.GLTFLoader();
            loader.load('models/assets/hot_wheels_unleashed.glb', (gltf) => {
                scene.remove(carMesh);
                carMesh = gltf.scene;
                carMesh.scale.set(0.02, 0.02, 0.02); // 1:64 ölçeklendirme faktörü
                scene.add(carMesh);
            }, undefined, (err) => {
                console.warn("Araba modeli yüklenemedi, temel geometri kullanılıyor.", err);
            });
        }

        function setupControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                controller.addEventListener('connected', (e) => {
                    controller.gamepad = e.data.gamepad;
                });
                scene.add(controller);
                controllers.push(controller);
            }
        }

        function createVRMenu() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            menuCtx = canvas.getContext('2d');
            
            menuTexture = new THREE.CanvasTexture(canvas);
            const menuGeo = new THREE.PlaneGeometry(0.5, 0.25);
            const menuMat = new THREE.MeshBasicMaterial({ map: menuTexture, transparent: true });
            menuMesh = new THREE.Mesh(menuGeo, menuMat);
            
            menuMesh.position.set(0, 1.1, -0.7);
            menuMesh.visible = false;
            scene.add(menuMesh);
            updateMenuCanvas();
        }

        function updateMenuCanvas() {
            menuCtx.clearRect(0, 0, 512, 256);
            menuCtx.fillStyle = 'rgba(10, 10, 20, 0.9)';
            menuCtx.fillRect(0, 0, 512, 256);

            menuCtx.fillStyle = '#ffffff';
            menuCtx.font = 'bold 24px sans-serif';
            menuCtx.fillText("TRACK SELECTION", 30, 40);

            tracks.forEach((track, index) => {
                menuCtx.fillStyle = (index === selectedTrackIndex) ? '#ffcc00' : '#ffffff';
                menuCtx.font = '20px sans-serif';
                menuCtx.fillText(`${index === selectedTrackIndex ? '▶' : ' '} ${track.name}`, 40, 100 + (index * 55));
            });

            if (menuTexture) menuTexture.needsUpdate = true;
        }

        function loadTrack(index) {
            if (currentTrackMesh) scene.remove(currentTrackMesh);
            if (currentTrackBody) world.remove(currentTrackBody);

            const loader = new THREE.GLTFLoader();
            loader.load(tracks[index].file, (gltf) => {
                currentTrackMesh = gltf.scene;
                currentTrackMesh.scale.set(1, 1, 1);
                scene.add(currentTrackMesh);

                // Yol ve adaptör için fiziksel çarpışma gövdesi (Static Body)
                const trackShape = new CANNON.Box(new CANNON.Vec3(1.2, 0.02, 1.2));
                currentTrackBody = new CANNON.Body({ mass: 0 }); // Sabit zemin/pist
                currentTrackBody.addShape(trackShape);
                currentTrackBody.position.set(0, 0.005, -0.8);
                world.add(currentTrackBody);

            }, undefined, (err) => {
                console.warn("Pist dosyası yüklenemedi:", err);
            });
        }

        function handleInput() {
            throttle = 0;
            steering = 0;

            controllers.forEach((controller, index) => {
                if (!controller.gamepad) return;
                const gp = controller.gamepad;

                // Sağ Kontrolör: İleri (Trigger) & Geri (Grip)
                if (gp.hand === 'right' || index === 1) {
                    const trig = gp.buttons[0] ? gp.buttons[0].value : 0;
                    const grip = gp.buttons[1] ? gp.buttons[1].value : 0;
                    if (trig > 0.05) throttle += trig * 2.5;
                    if (grip > 0.05) throttle -= grip * 1.8;
                }

                // Sol Kontrolör: Joystick ile Yön ve Menü Tuşu
                if (gp.hand === 'left' || index === 0) {
                    if (gp.axes.length >= 2) {
                        steering = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
                    }

                    // Menü Tuşu kontrolü (Quest kontrolcülerinde genelde buton 3 veya 4)
                    const menuBtn = gp.buttons[3] || gp.buttons[4];
                    if (menuBtn && menuBtn.pressed && !window._menuPressed) {
                        menuVisible = !menuVisible;
                        menuMesh.visible = menuVisible;
                        window._menuPressed = true;
                    } else if (menuBtn && !menuBtn.pressed) {
                        window._menuPressed = false;
                    }

                    // Menü açıkken sol joystick yukarı/aşağı ile pist seçimi
                    if (menuVisible && gp.axes.length >= 2) {
                        let yAxis = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
                        if (yAxis < -0.5 && !window._joySwitched) {
                            selectedTrackIndex = (selectedTrackIndex - 1 + tracks.length) % tracks.length;
                            updateMenuCanvas();
                            loadTrack(selectedTrackIndex);
                            window._joySwitched = true;
                        } else if (yAxis > 0.5 && !window._joySwitched) {
                            selectedTrackIndex = (selectedTrackIndex + 1) % tracks.length;
                            updateMenuCanvas();
                            loadTrack(selectedTrackIndex);
                            window._joySwitched = true;
                        } else if (Math.abs(yAxis) < 0.2) {
                            window._joySwitched = false;
                        }
                    }
                }
            });
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            handleInput();

            // Fizik Adımı Simülasyonu
            world.step(1 / 60);

            // Araba Fizik Kuvvet ve Yönlendirme Hesaplamaları
            const fwd = new CANNON.Vec3(0, 0, -1);
            carBody.quaternion.vmult(fwd, fwd);
            
            carBody.applyForce(new CANNON.Vec3(fwd.x * throttle, 0, fwd.z * throttle), carBody.position);
            carBody.angularVelocity.y = -steering * 3.5;

            // Görsel Modeli Fiziksel Konumla Senkronize Et
            if (carMesh) {
                carMesh.position.copy(carBody.position);
                carMesh.quaternion.copy(carBody.quaternion);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
