<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels VR - Snap & Physics System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 18px; text-align: center; pointer-events: none;
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px; z-index: 999;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Sistem Başlatılıyor...</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import * as CANNON from 'cannon-es';

        const loadingDiv = document.getElementById('loading');
        function logStatus(msg) { loadingDiv.innerHTML = msg; }

        // 1. Sahne Kurulumu
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 2. Fizik Dünyası
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Araba Veri Yapısı
        let playerCar = null;
        let dummyCars = [];
        let tracks = [];
        let adapters = [];

        // Ana Araba Şasi Oluşturma
        const chassisShape = new CANNON.Box(new CANNON.Vec3(0.15, 0.05, 0.3));
        const playerChassisBody = new CANNON.Body({ mass: 5 });
        playerChassisBody.addShape(chassisShape);
        playerChassisBody.position.set(0, 0.5, -1);
        world.addBody(playerChassisBody);

        const playerVehicle = new CANNON.RaycastVehicle({ chassisBody: playerChassisBody });
        const wheelOpts = {
            radius: 0.05, directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 30, suspensionRestLength: 0.1, axleLocal: new CANNON.Vec3(1, 0, 0),
            chassisConnectionPointLocal: new CANNON.Vec3(0, 0, 0)
        };
        wheelOpts.chassisConnectionPointLocal.set(-0.1, -0.02, 0.15); playerVehicle.addWheel(wheelOpts);
        wheelOpts.chassisConnectionPointLocal.set(0.1, -0.02, 0.15); playerVehicle.addWheel(wheelOpts);
        wheelOpts.chassisConnectionPointLocal.set(-0.1, -0.02, -0.15); playerVehicle.addWheel(wheelOpts);
        wheelOpts.chassisConnectionPointLocal.set(0.1, -0.02, -0.15); playerVehicle.addWheel(wheelOpts);
        playerVehicle.addToWorld(world);

        // 3. Model Yüklemeleri
        const gltfLoader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        gltfLoader.setDRACOLoader(dracoLoader);

        let carModelTemplate = null;
        logStatus("Modeller Hazırlanıyor...");

        gltfLoader.load('assets/models/hot_wheels_unleashed.glb', (gltf) => {
            carModelTemplate = gltf.scene;
            playerCar = carModelTemplate.clone();
            playerCar.scale.set(0.05, 0.05, 0.05);
            scene.add(playerCar);
            logStatus("Hazır! VR Gözlüğünü Takıp 'Enter VR' Butonuna Basın.");
            setTimeout(() => { loadingDiv.style.display = 'none'; }, 2000);
        });

        // Yardımcı Dummy Araba Oluşturucu (B Butonu için)
        function spawnDummyCar() {
            if (!carModelTemplate) return;
            const dummyMesh = carModelTemplate.clone();
            dummyMesh.scale.set(0.05, 0.05, 0.05);
            scene.add(dummyMesh);

            const dummyBody = new CANNON.Body({ mass: 3 });
            dummyBody.addShape(new CANNON.Box(new CANNON.Vec3(0.15, 0.05, 0.3)));
            
            // Oyuncunun 50cm önüne yerleştir
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.multiplyScalar(0.5));
            dummyBody.position.set(spawnPos.x, spawnPos.y, spawnPos.z);
            world.addBody(dummyBody);

            dummyCars.push({ mesh: dummyMesh, body: dummyBody });
        }

        // Yardımcı Yol Parçası Oluşturucu (X Butonu için)
        function spawnTrack(pos) {
            const trackGeo = new THREE.BoxGeometry(0.08, 0.01, 0.4); // 40cm Hotwheels yolu
            const trackMat = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.3 });
            const trackMesh = new THREE.Mesh(trackGeo, trackMat);
            trackMesh.position.copy(pos);
            scene.add(trackMesh);

            const trackBody = new CANNON.Body({ mass: 1 });
            trackBody.addShape(new CANNON.Box(new CANNON.Vec3(0.04, 0.005, 0.2)));
            trackBody.position.copy(pos);
            world.addBody(trackBody);

            const trackObj = { mesh: trackMesh, body: trackBody, grabbedBy: [], isLocked: false };
            tracks.push(trackObj);
            return trackObj;
        }

        // Yardımcı Adaptör Oluşturucu (Y Butonu için)
        function spawnAdapter(pos) {
            const adaptGeo = new THREE.BoxGeometry(0.04, 0.008, 0.08); // Mavi kilit parçası
            const adaptMat = new THREE.MeshStandardMaterial({ color: 0x0066ff });
            const adaptMesh = new THREE.Mesh(adaptGeo, adaptMat);
            adaptMesh.position.copy(pos);
            scene.add(adaptMesh);

            const adaptBody = new CANNON.Body({ mass: 0.2 });
            adaptBody.addShape(new CANNON.Box(new CANNON.Vec3(0.02, 0.004, 0.04)));
            adaptBody.position.copy(pos);
            world.addBody(adaptBody);

            const adaptObj = { mesh: adaptMesh, body: adaptBody, grabbedBy: null, snappedTo: null };
            adapters.push(adaptObj);
            return adaptObj;
        }

        // 4. VR Kontrolcüleri ve Buton Mantığı
        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        scene.add(controller1); scene.add(controller2);

        // Son Buton Durumları (Bir kez tetiklenmesi için)
        let lastButtons = { x: false, y: false, a: false, b: false };

        function processVRInputs() {
            const session = renderer.xr.getSession();
            if (!session) return;

            const posLeft = new THREE.Vector3();
            const posRight = new THREE.Vector3();
            controller1.getWorldPosition(posLeft);
            controller2.getWorldPosition(posRight);

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const gp = source.gamepad;
                const hand = source.handedness;
                const ctrl = hand === 'left' ? controller1 : controller2;
                const ctrlPos = hand === 'left' ? posLeft : posRight;

                const trigger = gp.buttons[0]?.pressed;
                const grip = gp.buttons[1]?.pressed;
                const btnA_X = gp.buttons[4]?.pressed; // Left X / Right A
                const btnB_Y = gp.buttons[5]?.pressed; // Left Y / Right B

                // --- SOL EL BUTONLARI (X / Y) ---
                if (hand === 'left') {
                    // X Basınca Yeni Yol Spawn Et
                    if (btnA_X && !lastButtons.x) { spawnTrack(ctrlPos); }
                    lastButtons.x = btnA_X;

                    // Y Basınca Yeni Adaptör Spawn Et
                    if (btnB_Y && !lastButtons.y) { spawnAdapter(ctrlPos); }
                    lastButtons.y = btnB_Y;

                    // Direksiyon Kontrolü
                    const steerAxis = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
                    playerVehicle.setSteeringValue(-steerAxis * 0.5, 0);
                    playerVehicle.setSteeringValue(-steerAxis * 0.5, 1);
                }

                // --- SAĞ EL BUTONLARI (A / B) ---
                if (hand === 'right') {
                    // A Basınca Arabayı 15cm Öne Işınla veya Yolu Kilitle
                    if (btnA_X && !lastButtons.a) {
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);
                        const targetPos = camera.position.clone().add(camDir.multiplyScalar(0.15));
                        
                        playerChassisBody.position.set(targetPos.x, targetPos.y, targetPos.z);
                        playerChassisBody.velocity.set(0, 0, 0);
                        playerChassisBody.angularVelocity.set(0, 0, 0);

                        // İki elle tutulan yolu kilitle
                        tracks.forEach(t => {
                            if (t.grabbedBy.length > 0) {
                                t.isLocked = true;
                                t.body.type = CANNON.Body.STATIC;
                            }
                        });
                    }
                    lastButtons.a = btnA_X;

                    // B Basınca Dummy Araba Spawn Et
                    if (btnB_Y && !lastButtons.b) { spawnDummyCar(); }
                    lastButtons.b = btnB_Y;

                    // Gaz / Fren Kontrolü
                    const engineForce = trigger ? -60 : (grip ? 30 : 0);
                    playerVehicle.applyEngineForce(engineForce, 2);
                    playerVehicle.applyEngineForce(engineForce, 3);
                }

                // --- ETKİLEŞİM VE TUTMA MANTIĞI ---
                tracks.forEach(t => {
                    const trackPos = new THREE.Vector3(t.body.position.x, t.body.position.y, t.body.position.z);
                    
                    if (ctrlPos.distanceTo(trackPos) < 0.2 && grip) {
                        if (!t.grabbedBy.includes(ctrl)) t.grabbedBy.push(ctrl);
                        t.isLocked = false; // Eldeyken kilit açılır
                        t.body.type = CANNON.Body.KINEMATIC;
                    } else if (!grip) {
                        t.grabbedBy = t.grabbedBy.filter(c => c !== ctrl);
                        if (t.grabbedBy.length === 0 && !t.isLocked) {
                            t.body.type = CANNON.Body.DYNAMIC;
                        }
                    }

                    // İKİ ELLE YOL YÖNLENDİRME (Teğet / Paralel Bükme)
                    if (t.grabbedBy.length === 2) {
                        const midPoint = new THREE.Vector3().addVectors(posLeft, posRight).multiplyScalar(0.5);
                        t.body.position.copy(midPoint);

                        const dir = new THREE.Vector3().subVectors(posRight, posLeft).normalize();
                        const rotMatrix = new THREE.Matrix4();
                        rotMatrix.lookAt(posLeft, posRight, THREE.Object3D.DEFAULT_UP);
                        const q = new THREE.Quaternion().setFromRotationMatrix(rotMatrix);
                        t.body.quaternion.copy(q);
                    } else if (t.grabbedBy.length === 1) {
                        t.body.position.copy(ctrlPos);
                        t.body.quaternion.copy(ctrl.quaternion);
                    }
                });

                // ADAPTÖR SNAP / YAPIŞMA MANTIĞI (8 cm Yakınlık)
                adapters.forEach(a => {
                    const adaptPos = new THREE.Vector3(a.body.position.x, a.body.position.y, a.body.position.z);

                    if (ctrlPos.distanceTo(adaptPos) < 0.1 && grip) {
                        a.grabbedBy = ctrl;
                        a.body.type = CANNON.Body.KINEMATIC;
                        a.snappedTo = null;
                    } else if (!grip && a.grabbedBy === ctrl) {
                        a.grabbedBy = null;
                        
                        // En yakın yol parçasını bul (8 cm = 0.08m)
                        let closestTrack = null;
                        let minDist = 0.08;

                        tracks.forEach(t => {
                            const tPos = new THREE.Vector3(t.body.position.x, t.body.position.y, t.body.position.z);
                            const dist = adaptPos.distanceTo(tPos);
                            if (dist < minDist) {
                                minDist = dist;
                                closestTrack = t;
                            }
                        });

                        if (closestTrack) {
                            // Videodaki gibi yolun ucuna hizala ve kenetle
                            a.snappedTo = closestTrack;
                            a.body.type = CANNON.Body.STATIC;
                            a.body.position.copy(closestTrack.body.position);
                            a.body.quaternion.copy(closestTrack.body.quaternion);
                        } else {
                            a.body.type = CANNON.Body.DYNAMIC;
                        }
                    }

                    if (a.grabbedBy) {
                        a.body.position.copy(ctrlPos);
                        a.body.quaternion.copy(ctrl.quaternion);
                    }
                });
            }
        }

        // 5. Animasyon Döngüsü
        renderer.setAnimationLoop(() => {
            world.fixedStep();
            processVRInputs();

            // Ana Araba Görsel Güncelleme
            if (playerCar) {
                playerCar.position.copy(playerChassisBody.position);
                playerCar.quaternion.copy(playerChassisBody.quaternion);
            }

            // Dummy Arabalar Güncelleme
            dummyCars.forEach(d => {
                d.mesh.position.copy(d.body.position);
                d.mesh.quaternion.copy(d.body.quaternion);
            });

            // Yollar Güncelleme
            tracks.forEach(t => {
                t.mesh.position.copy(t.body.position);
                t.mesh.quaternion.copy(t.body.quaternion);
            });

            // Adaptörler Güncelleme
            adapters.forEach(a => {
                a.mesh.position.copy(a.body.position);
                a.mesh.quaternion.copy(a.body.quaternion);
            });

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
