<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels MR - Full Physics Engine</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px #00ffcc;
      z-index: 9999;
    }
    #loading-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #00ffcc;
      z-index: 9999;
    }
  </style>

  <!-- THREE.JS & GLTF LOADER -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- CANNON-ES ES MODULE LOADING -->
  <script type="module">
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';
    window.CANNON = CANNON;
  </script>
</head>
<body>

  <button id="start-btn" style="display:none;">START HOT WHEELS MR</button>
  <div id="loading-text">Loading Model and Physics Engine...</div>

<script>
  var scene, camera, renderer;
  var carMesh; 
  var loadedReverbModel = null;

  // CANNON.ES PHYSICS VARIABLES
  var world;
  var vehicle;
  var chassisBody;
  var groundBody;
  var physicsHitboxes = [];

  // Driving Variables
  var maxEngineForce = 15;
  var maxBrakeForce = 5;
  var currentEngineForce = 0;
  var currentBrakingForce = 0;
  var currentSteering = 0;
  var maxSteerVal = 0.5; 

  var isThrottlePressed = false;
  var isBrakePressed = false;
  var turnValue = 0;
  var STICK_DEADZONE = 0.15;

  // Controllers
  var controller0 = null;
  var controller1 = null;
  var leftController = null;
  var rightController = null;
  var isSpawnedAtUser = false;

  // Menu Variables
  var isMenuOpen = false;
  var selectedMenuIndex = 0; 
  var activeMode = "NONE";   
  
  var menuButtonPressedLastFrame = false;
  var xButtonPressedLastFrame = false;
  var aButtonPressedLastFrame = false;
  var bButtonPressedLastFrame = false;
  var rightTriggerPressedLastFrame = false;

  var squareMenuMesh;
  var canvasMenu, ctxMenu, textureMenu;

  // HITBOX VARIABLES
  var customHitboxes = []; 
  var hitboxVisuals = [];  
  var point1 = null; 
  var previewBoxMesh = null; 
  var pointMarkers = [];

  var selectedHitboxIndex = 0; 
  var selectedColorIndex = 0;  
  var currentOpacity = 0.50;   
  var currentBrightness = 0.30; 
  var rotX = 0, rotY = 0, rotZ = 0;

  var activeSubSelection = 0;  
  var isEditingValue = false; 

  var repeatTimers = {};

  function checkAutoRepeat(key, isPressed, initialDelayMs, repeatRateMs, callback) {
    var now = performance.now();
    if (isPressed) {
      if (!repeatTimers[key]) {
        repeatTimers[key] = { lastTime: now, startTime: now, initialTriggered: false };
        callback();
      } else {
        var timer = repeatTimers[key];
        var elapsed = now - timer.startTime;
        if (!timer.initialTriggered) {
          if (elapsed >= initialDelayMs) {
            timer.initialTriggered = true;
            timer.lastTime = now;
            callback();
          }
        } else {
          if (now - timer.lastTime >= repeatRateMs) {
            timer.lastTime = now;
            callback();
          }
        }
      }
    } else {
      delete repeatTimers[key];
    }
  }

  var rainbowPalette = [
    { name: "Gray (Default)", hex: 0x888888, str: "#888888" },
    { name: "Red",            hex: 0xff0000, str: "#ff0000" },
    { name: "Orange",         hex: 0xff7f00, str: "#ff7f00" },
    { name: "Yellow",         hex: 0xffff00, str: "#ffff00" },
    { name: "Green",          hex: 0x00ff00, str: "#00ff00" },
    { name: "Cyan",           hex: 0x00ffff, str: "#00ffff" },
    { name: "Blue",           hex: 0x0000ff, str: "#0000ff" },
    { name: "Indigo",         hex: 0x4b0082, str: "#4b0082" },
    { name: "Purple",         hex: 0x9400d3, str: "#9400d3" }
  ];

  var startBtn = document.getElementById('start-btn');
  var loadingText = document.getElementById('loading-text');

  var loader = new THREE.GLTFLoader();

  // DÜZELTİLDİ: GitHub Pages uyumlu kesin yol (./ kaldırıldı)
  loader.load('assets/models/hot_wheels_unleashed.glb', function(gltf) {
    loadedReverbModel = gltf.scene;

    var bboxInitial = new THREE.Box3().setFromObject(loadedReverbModel);
    var center = new THREE.Vector3();
    bboxInitial.getCenter(center);
    loadedReverbModel.position.sub(center); 

    var wrapperGroup = new THREE.Group();
    wrapperGroup.add(loadedReverbModel);
    loadedReverbModel.rotation.y = 0; 

    var bboxScaled = new THREE.Box3().setFromObject(wrapperGroup);
    var currentLength = bboxScaled.max.z - bboxScaled.min.z;
    if ((bboxScaled.max.x - bboxScaled.min.x) > currentLength) {
      currentLength = bboxScaled.max.x - bboxScaled.min.x;
    }

    var targetLength = 0.08; 
    var targetScale = targetLength / currentLength;
    wrapperGroup.scale.set(targetScale, targetScale, targetScale);

    wrapperGroup.traverse(function(child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    loadedReverbModel = wrapperGroup;

    loadingText.style.display = 'none';
    startBtn.style.display = 'block';

  }, function(xhr) {
    if (xhr.total > 0) {
      var percent = Math.round((xhr.loaded / xhr.total) * 100);
      loadingText.innerText = 'Preparing Model... %' + percent;
    }
  }, function(error) {
    console.error('GLB Loading Error:', error);
    loadingText.style.color = '#ff3366';
    loadingText.innerText = 'ERROR: "hot_wheels_unleashed.glb" not found in assets/models/';
  });

  startBtn.addEventListener('click', function() {
    if (!navigator.xr) {
      alert('WebXR is not supported!');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'local-floor', 'bounded-floor']
    }).then(function(session) {
      startBtn.style.display = 'none';
      initThreeJS(session);
    }).catch(function(err) {
      alert('MR Session Failed: ' + err.message);
    });
  });

  function initPhysics() {
    world = new CANNON.World();
    world.gravity.set(0, -9.81, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);

    var defaultMaterial = new CANNON.Material('default');
    var wheelMaterial = new CANNON.Material('wheel');

    var defaultContactMaterial = new CANNON.ContactMaterial(
      defaultMaterial,
      defaultMaterial,
      { friction: 0.4, restitution: 0.2 }
    );
    var wheelContactMaterial = new CANNON.ContactMaterial(
      wheelMaterial,
      defaultMaterial,
      { friction: 0.8, restitution: 0.1 }
    );

    world.addContactMaterial(defaultContactMaterial);
    world.addContactMaterial(wheelContactMaterial);

    // GROUND PLANE
    var groundShape = new CANNON.Plane();
    groundBody = new CANNON.Body({ mass: 0, material: defaultMaterial });
    groundBody.addShape(groundShape);
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // CAR CHASSIS
    var chassisShape = new CANNON.Box(new CANNON.Vec3(0.02, 0.008, 0.04));
    chassisBody = new CANNON.Body({ mass: 2.0, material: defaultMaterial });
    chassisBody.addShape(chassisShape);
    chassisBody.position.set(0, 0.1, -0.4);
    chassisBody.angularDamping = 0.5;
    chassisBody.linearDamping = 0.2;

    // RAYCAST VEHICLE
    vehicle = new CANNON.RaycastVehicle({
      chassisBody: chassisBody,
      indexRightAxis: 0,
      indexUpAxis: 1,
      indexForwardAxis: 2
    });

    var wheelOptions = {
      radius: 0.01,
      directionLocal: new CANNON.Vec3(0, -1, 0),
      suspensionStiffness: 20,
      suspensionRestLength: 0.015,
      frictionSlip: 2.5,
      dampingRelaxation: 2.3,
      dampingCompression: 4.4,
      maxSuspensionForce: 1000,
      rollInfluence: 0.01,
      axleLocal: new CANNON.Vec3(1, 0, 0),
      chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 1),
      maxSuspensionTravel: 0.01,
      customSlidingRotationalSpeed: -30,
      useCustomSlidingRotationalSpeed: true
    };

    wheelOptions.chassisConnectionPointLocal.set(0.018, -0.004, 0.025);
    vehicle.addWheel(wheelOptions);

    wheelOptions.chassisConnectionPointLocal.set(-0.018, -0.004, 0.025);
    vehicle.addWheel(wheelOptions);

    wheelOptions.chassisConnectionPointLocal.set(0.018, -0.004, -0.025);
    vehicle.addWheel(wheelOptions);

    wheelOptions.chassisConnectionPointLocal.set(-0.018, -0.004, -0.025);
    vehicle.addWheel(wheelOptions);

    vehicle.addToWorld(world);
  }

  function updateMenuTexture() {
    ctxMenu.fillStyle = 'rgba(15, 15, 20, 0.95)';
    ctxMenu.fillRect(0, 0, 512, 512);

    ctxMenu.strokeStyle = '#00ffcc';
    ctxMenu.lineWidth = 10;
    ctxMenu.strokeRect(5, 5, 502, 502);

    ctxMenu.fillStyle = '#00ffcc';
    ctxMenu.font = 'bold 32px sans-serif';
    ctxMenu.textAlign = 'center';
    ctxMenu.fillText('SETTINGS MENU', 256, 45);

    if (activeMode === "NONE") {
      var items = ["1. Set Ground Level", "2. Add Hitbox", "3. Edit Hitbox"];
      for (var i = 0; i < 3; i++) {
        var yPos = 120 + (i * 90);
        if (selectedMenuIndex === i) {
          ctxMenu.fillStyle = '#00ffcc';
          ctxMenu.fillRect(30, yPos, 452, 70);
          ctxMenu.fillStyle = '#000000';
          ctxMenu.font = 'bold 26px sans-serif';
          ctxMenu.fillText('> ' + items[i] + ' <', 256, yPos + 45);
        } else {
          ctxMenu.fillStyle = '#ffffff';
          ctxMenu.font = '24px sans-serif';
          ctxMenu.fillText(items[i], 256, yPos + 45);
        }
      }
      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '20px sans-serif';
      ctxMenu.fillText('Navigate: Left Stick | Select: [ X ]', 256, 450);

    } else if (activeMode === "LEVELING") {
      ctxMenu.fillStyle = '#ffcc00';
      ctxMenu.font = 'bold 30px sans-serif';
      ctxMenu.fillText('SET GROUND LEVEL', 256, 140);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '24px sans-serif';
      ctxMenu.fillText('Use Left Stick to Adjust Height', 256, 220);
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.fillText('Save & Exit: [ X ]', 256, 330);

    } else if (activeMode === "HITBOX_BUILD") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 28px sans-serif';
      ctxMenu.fillText('2-POINT LIVE HITBOX', 256, 110);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '22px sans-serif';

      if (!point1) {
        ctxMenu.fillText('Press Right Trigger for Point 1', 256, 200);
      } else {
        ctxMenu.fillStyle = '#00ff00';
        ctxMenu.fillText('LIVE PREVIEW ACTIVE!', 256, 180);
        ctxMenu.fillStyle = '#ffffff';
        ctxMenu.fillText('Move Right Controller', 256, 220);
        ctxMenu.fillText('Finalize Hitbox: [ A ]', 256, 260);
      }

      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '18px sans-serif';
      ctxMenu.fillText('Cancel: [ X ]', 256, 370);

    } else if (activeMode === "HITBOX_LIST") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 28px sans-serif';
      ctxMenu.fillText('EXISTING HITBOXES', 256, 95);

      if (customHitboxes.length === 0) {
        ctxMenu.fillStyle = '#ff3366';
        ctxMenu.font = '24px sans-serif';
        ctxMenu.fillText('No Hitboxes Found!', 256, 220);
      } else {
        var startIdx = Math.max(0, selectedHitboxIndex - 1);
        var endIdx = Math.min(customHitboxes.length, startIdx + 3);

        for (var i = startIdx; i < endIdx; i++) {
          var yPos = 135 + ((i - startIdx) * 70);
          if (i === selectedHitboxIndex) {
            ctxMenu.fillStyle = '#00ffcc';
            ctxMenu.fillRect(50, yPos, 412, 55);
            ctxMenu.fillStyle = '#000000';
            ctxMenu.font = 'bold 24px sans-serif';
            ctxMenu.fillText('> HITBOX ' + (i + 1) + ' <', 256, yPos + 37);
          } else {
            ctxMenu.fillStyle = '#ffffff';
            ctxMenu.font = '22px sans-serif';
            ctxMenu.fillText('Hitbox ' + (i + 1), 256, yPos + 37);
          }
        }
      }

      ctxMenu.fillStyle = '#aaaaaa';
      ctxMenu.font = '19px sans-serif';
      ctxMenu.fillText('[ A ] Edit / Rotate  |  [ B ] Delete', 256, 415);
      ctxMenu.fillText('Exit: [ X ]', 256, 450);

    } else if (activeMode === "CONFIRM_DELETE") {
      ctxMenu.fillStyle = '#ff3366';
      ctxMenu.font = 'bold 30px sans-serif';
      ctxMenu.fillText('ARE YOU SURE?', 256, 140);
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '24px sans-serif';
      ctxMenu.fillText('Hitbox ' + (selectedHitboxIndex + 1) + ' will be deleted!', 256, 210);

      ctxMenu.fillStyle = '#33ff66';
      ctxMenu.fillText('[ A ] Yes, Delete', 256, 300);
      ctxMenu.fillStyle = '#ff3366';
      ctxMenu.fillText('[ B ] No, Cancel', 256, 350);

    } else if (activeMode === "HITBOX_COLOR_EDIT") {
      ctxMenu.fillStyle = '#00ffcc';
      ctxMenu.font = 'bold 22px sans-serif';
      ctxMenu.fillText('HITBOX ' + (selectedHitboxIndex + 1) + ' SETTINGS & ROTATION', 256, 65);

      var startX = 166;
      var startY = 80;
      var boxSize = 48;
      var gap = 10;

      for (var r = 0; r < 9; r++) {
        var col = r % 3;
        var row = Math.floor(r / 3);
        var bx = startX + col * (boxSize + gap);
        var by = startY + row * (boxSize + gap);

        ctxMenu.fillStyle = rainbowPalette[r].str;
        ctxMenu.fillRect(bx, by, boxSize, boxSize);

        if (r === selectedColorIndex && activeSubSelection === 0) {
          ctxMenu.strokeStyle = isEditingValue ? '#ffcc00' : '#ffffff';
          ctxMenu.lineWidth = 4;
          ctxMenu.strokeRect(bx - 2, by - 2, boxSize + 4, boxSize + 4);
        } else {
          ctxMenu.strokeStyle = '#000000';
          ctxMenu.lineWidth = 1;
          ctxMenu.strokeRect(bx, by, boxSize, boxSize);
        }
      }

      drawSlider(260, "Opacity: %" + Math.round(currentOpacity * 100), (currentOpacity - 0.1) / 0.9, activeSubSelection === 1);
      drawSlider(315, "Brightness: %" + Math.round(currentBrightness * 100), currentBrightness, activeSubSelection === 2);

      drawOptionRow(370, "Pitch (X): " + Math.round(rotX) + "°", activeSubSelection === 3);
      drawOptionRow(405, "Yaw (Y): " + Math.round(rotY) + "°", activeSubSelection === 4);
      drawOptionRow(440, "Roll (Z): " + Math.round(rotZ) + "°", activeSubSelection === 5);

      ctxMenu.fillStyle = isEditingValue ? '#ffcc00' : '#00ffcc';
      ctxMenu.font = '15px sans-serif';
      ctxMenu.fillText(isEditingValue ? 'EDITING ACTIVE!' : '[ A ] Lock/Unlock Value | [ X ] Save', 256, 485);
    }

    textureMenu.needsUpdate = true;
  }

  function drawSlider(y, label, percent, isSelected) {
    ctxMenu.fillStyle = '#ffffff';
    ctxMenu.font = '15px sans-serif';
    ctxMenu.fillText(label, 256, y - 5);

    ctxMenu.fillStyle = '#333333';
    ctxMenu.fillRect(90, y, 332, 14);

    ctxMenu.fillStyle = isSelected ? (isEditingValue ? '#ffcc00' : '#00ffcc') : '#00ffcc';
    ctxMenu.fillRect(90, y, Math.max(0, Math.min(1, percent)) * 332, 14);

    if (isSelected) {
      ctxMenu.strokeStyle = isEditingValue ? '#ffcc00' : '#ffffff';
      ctxMenu.lineWidth = 2;
      ctxMenu.strokeRect(87, y - 2, 338, 18);
    }
  }

  function drawOptionRow(y, label, isSelected) {
    if (isSelected) {
      ctxMenu.fillStyle = isEditingValue ? '#ffcc00' : '#00ffcc';
      ctxMenu.fillRect(100, y - 18, 312, 24);
      ctxMenu.fillStyle = '#000000';
      ctxMenu.font = 'bold 15px sans-serif';
      ctxMenu.fillText(isEditingValue ? '[ HOLD TO ADJUST ] ' + label : '> ' + label + ' <', 256, y);
    } else {
      ctxMenu.fillStyle = '#ffffff';
      ctxMenu.font = '15px sans-serif';
      ctxMenu.fillText(label, 256, y);
    }
  }

  function initThreeJS(session) {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    try {
      renderer.xr.setReferenceSpaceType('bounded-floor');
    } catch(e) {
      renderer.xr.setReferenceSpaceType('local-floor');
    }

    renderer.xr.setSession(session);
    document.body.appendChild(renderer.domElement);

    var light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.8);
    scene.add(light);
    var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    initPhysics();

    var hitboxGeometry = new THREE.BoxGeometry(0.04, 0.016, 0.08);
    var hitboxMaterial = new THREE.MeshBasicMaterial({ visible: false });
    carMesh = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
    scene.add(carMesh);

    if (loadedReverbModel) {
      carMesh.add(loadedReverbModel);
    }

    var prevGeo = new THREE.BoxGeometry(1, 1, 1);
    var prevMat = new THREE.MeshStandardMaterial({
      color: 0x00ff00,
      emissive: 0x00ff00,
      emissiveIntensity: 0.4,
      transparent: true,
      opacity: 0.4,
      wireframe: false
    });
    previewBoxMesh = new THREE.Mesh(prevGeo, prevMat);
    previewBoxMesh.visible = false;

    var edges = new THREE.EdgesGeometry(prevGeo);
    var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff00 }));
    previewBoxMesh.add(line);
    scene.add(previewBoxMesh);

    for (var m = 0; m < 2; m++) {
      var pointGeo = new THREE.SphereGeometry(0.012, 16, 16);
      var pointMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      var markerMesh = new THREE.Mesh(pointGeo, pointMat);
      markerMesh.visible = false;
      scene.add(markerMesh);
      pointMarkers.push(markerMesh);
    }

    controller0 = renderer.xr.getController(0);
    scene.add(controller0);

    controller1 = renderer.xr.getController(1);
    scene.add(controller1);

    canvasMenu = document.createElement('canvas');
    canvasMenu.width = 512;
    canvasMenu.height = 512;
    ctxMenu = canvasMenu.getContext('2d');
    textureMenu = new THREE.CanvasTexture(canvasMenu);

    updateMenuTexture();

    var planeGeo = new THREE.PlaneGeometry(0.16, 0.16); 
    var planeMat = new THREE.MeshBasicMaterial({ map: textureMenu, side: THREE.DoubleSide, transparent: true });
    squareMenuMesh = new THREE.Mesh(planeGeo, planeMat);

    squareMenuMesh.position.set(0, 0.12, -0.05);
    squareMenuMesh.rotation.x = -Math.PI / 6; 
    squareMenuMesh.visible = false;

    renderer.setAnimationLoop(render);
  }

  function updatePreviewBox(p1, currentP2) {
    if (!p1 || !currentP2) return;

    var minX = Math.min(p1.x, currentP2.x);
    var maxX = Math.max(p1.x, currentP2.x);
    var minY = Math.min(p1.y, currentP2.y);
    var maxY = Math.max(p1.y, currentP2.y);
    var minZ = Math.min(p1.z, currentP2.z);
    var maxZ = Math.max(p1.z, currentP2.z);

    var sizeX = Math.max(0.01, maxX - minX);
    var sizeY = Math.max(0.01, maxY - minY);
    var sizeZ = Math.max(0.01, maxZ - minZ);

    previewBoxMesh.scale.set(sizeX, sizeY, sizeZ);
    previewBoxMesh.position.set(
      minX + sizeX / 2,
      minY + sizeY / 2,
      minZ + sizeZ / 2
    );
    previewBoxMesh.visible = true;
  }

  function finalizeHitboxFromPreview() {
    if (!previewBoxMesh || !previewBoxMesh.visible) return;

    var sizeX = previewBoxMesh.scale.x;
    var sizeY = previewBoxMesh.scale.y;
    var sizeZ = previewBoxMesh.scale.z;

    var boxGeo = new THREE.BoxGeometry(sizeX, sizeY, sizeZ);
    var hexCol = rainbowPalette[0].hex;

    var boxMat = new THREE.MeshStandardMaterial({
      color: hexCol,
      emissive: hexCol,
      emissiveIntensity: currentBrightness,
      transparent: true,
      opacity: currentOpacity,
      roughness: 0.2
    });

    var boxMesh = new THREE.Mesh(boxGeo, boxMat);
    boxMesh.position.copy(previewBoxMesh.position);

    var edges = new THREE.EdgesGeometry(boxGeo);
    var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: hexCol }));
    boxMesh.add(line);

    scene.add(boxMesh);
    hitboxVisuals.push(boxMesh);

    var boxShape = new CANNON.Box(new CANNON.Vec3(sizeX / 2, sizeY / 2, sizeZ / 2));
    var boxBody = new CANNON.Body({ mass: 0 }); 
    boxBody.addShape(boxShape);
    boxBody.position.copy(previewBoxMesh.position);
    world.addBody(boxBody);

    physicsHitboxes.push(boxBody);

    customHitboxes.push({
      mesh: boxMesh,
      body: boxBody,
      rotX: 0,
      rotY: 0,
      rotZ: 0
    });

    previewBoxMesh.visible = false;
    for (var k = 0; k < pointMarkers.length; k++) pointMarkers[k].visible = false;
  }

  function removeHitbox(index) {
    if (index >= 0 && index < customHitboxes.length) {
      scene.remove(hitboxVisuals[index]);
      world.removeBody(physicsHitboxes[index]);

      hitboxVisuals.splice(index, 1);
      physicsHitboxes.splice(index, 1);
      customHitboxes.splice(index, 1);

      if (selectedHitboxIndex >= customHitboxes.length) {
        selectedHitboxIndex = Math.max(0, customHitboxes.length - 1);
      }
    }
  }

  function updateHitboxAppearance(index, colorHex, opacity, brightness, rx, ry, rz) {
    if (index >= 0 && index < hitboxVisuals.length) {
      var boxMesh = hitboxVisuals[index];
      var boxBody = physicsHitboxes[index];

      boxMesh.material.color.setHex(colorHex);
      boxMesh.material.emissive.setHex(colorHex);
      boxMesh.material.emissiveIntensity = brightness;
      boxMesh.material.opacity = opacity;
      
      var eulerRadX = THREE.MathUtils.degToRad(rx);
      var eulerRadY = THREE.MathUtils.degToRad(ry);
      var eulerRadZ = THREE.MathUtils.degToRad(rz);

      boxMesh.rotation.set(eulerRadX, eulerRadY, eulerRadZ);
      boxBody.quaternion.setFromEuler(eulerRadX, eulerRadY, eulerRadZ);

      if (boxMesh.children.length > 0) {
        boxMesh.children[0].material.color.setHex(colorHex);
      }

      customHitboxes[index].rotX = rx;
      customHitboxes[index].rotY = ry;
      customHitboxes[index].rotZ = rz;
    }
  }

  function restoreAllHitboxesOpacity() {
    for (var h = 0; h < hitboxVisuals.length; h++) {
      hitboxVisuals[h].material.opacity = currentOpacity;
    }
  }

  function teleportCarToUser() {
    if (!camera || !chassisBody) return;

    var camPos = new THREE.Vector3();
    var camQuat = new THREE.Quaternion();
    camera.getWorldPosition(camPos);
    camera.getWorldQuaternion(camQuat);

    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
    forward.y = 0;
    forward.normalize();

    var targetPos = camPos.clone().add(forward.multiplyScalar(0.5));

    chassisBody.position.set(targetPos.x, groundBody.position.y + 0.05, targetPos.z);
    chassisBody.velocity.set(0, 0, 0);
    chassisBody.angularVelocity.set(0, 0, 0);

    var angle = Math.atan2(forward.x, forward.z);
    chassisBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle + Math.PI);
  }

  var lastTime = performance.now();

  function render(time, frame) {
    var session = renderer.xr.getSession();
    var delta = (time - lastTime) / 1000;
    if (delta > 0.1) delta = 0.1;
    lastTime = time;

    if (world) {
      world.step(1 / 60, delta, 3);
    }

    if (!isSpawnedAtUser && camera) {
      var camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
        teleportCarToUser();
        isSpawnedAtUser = true;
      }
    }

    if (isMenuOpen && activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
      for (var h = 0; h < hitboxVisuals.length; h++) {
        if (h === selectedHitboxIndex) {
          hitboxVisuals[h].material.opacity = 0.3 + Math.sin(time * 0.01) * 0.25;
        } else {
          hitboxVisuals[h].material.opacity = currentOpacity;
        }
      }
    }

    var leftTriggerPressed = false;
    var rightTriggerPressed = false;

    isThrottlePressed = false;
    isBrakePressed = false;
    turnValue = 0;

    if (session && session.inputSources) {
      for (var i = 0; i < session.inputSources.length; i++) {
        var source = session.inputSources[i];
        if (!source.gamepad) continue;

        var targetController = (i === 0) ? controller0 : controller1;
        if (source.handedness === 'left') {
          leftController = targetController;
          if (squareMenuMesh.parent !== leftController) {
            leftController.add(squareMenuMesh);
          }
        } else if (source.handedness === 'right') {
          rightController = targetController;
        }

        var btns = source.gamepad.buttons;
        var axes = source.gamepad.axes;

        var stickX = 0;
        var stickY = 0;
        if (axes && axes.length >= 2) {
          stickX = axes.length >= 4 ? axes[2] : axes[0];
          stickY = axes.length >= 4 ? axes[3] : axes[1];
        }

        if (source.handedness === 'right') {
          var rTriggerValue = btns[0] ? btns[0].value : 0;
          var rGripValue = btns[1] ? btns[1].value : 0;

          if (rTriggerValue > 0.1) {
            rightTriggerPressed = true;
            if (!isMenuOpen) {
              isThrottlePressed = true;
            }
          }
          if (rGripValue > 0.1) {
            if (!isMenuOpen) {
              isBrakePressed = true;
            }
          }

          if (!isMenuOpen && Math.abs(stickY) > STICK_DEADZONE) {
            if (stickY < -STICK_DEADZONE) {
              isThrottlePressed = true;
            } else if (stickY > STICK_DEADZONE) {
              isBrakePressed = true;
            }
          }

          var aBtnPressed = (btns[4] && btns[4].pressed);
          if (aBtnPressed && !aButtonPressedLastFrame) {
            if (activeMode === "HITBOX_BUILD" && point1) {
              finalizeHitboxFromPreview();
              point1 = null;
              activeMode = "NONE";
              updateMenuTexture();
            } else if (activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
              var hb = customHitboxes[selectedHitboxIndex];
              rotX = hb.rotX;
              rotY = hb.rotY;
              rotZ = hb.rotZ;
              activeMode = "HITBOX_COLOR_EDIT";
              isEditingValue = false;
              updateMenuTexture();
            } else if (activeMode === "HITBOX_COLOR_EDIT") {
              isEditingValue = !isEditingValue;
              updateMenuTexture();
            } else if (activeMode === "CONFIRM_DELETE") {
              removeHitbox(selectedHitboxIndex);
              activeMode = "HITBOX_LIST";
              restoreAllHitboxesOpacity();
              updateMenuTexture();
            } else if (activeMode === "NONE" && !isMenuOpen) {
              teleportCarToUser(); 
            }
          }
          aButtonPressedLastFrame = aBtnPressed;

          var bBtnPressed = (btns[5] && btns[5].pressed);
          if (bBtnPressed && !bButtonPressedLastFrame) {
            if (activeMode === "HITBOX_LIST" && customHitboxes.length > 0) {
              activeMode = "CONFIRM_DELETE";
              updateMenuTexture();
            } else if (activeMode === "CONFIRM_DELETE") {
              activeMode = "HITBOX_LIST";
              updateMenuTexture();
            }
          }
          bButtonPressedLastFrame = bBtnPressed;

          if (rightTriggerPressed && !rightTriggerPressedLastFrame && rightController) {
            if (activeMode === "HITBOX_BUILD" && !point1) {
              point1 = new THREE.Vector3();
              rightController.getWorldPosition(point1);
              pointMarkers[0].position.copy(point1);
              pointMarkers[0].visible = true;
              updateMenuTexture();
            }
          }
          rightTriggerPressedLastFrame = rightTriggerPressed;

          if (activeMode === "HITBOX_BUILD" && point1 && rightController) {
            var currentRightPos = new THREE.Vector3();
            rightController.getWorldPosition(currentRightPos);
            updatePreviewBox(point1, currentRightPos);
          }
        }

        if (source.handedness === 'left') {
          var yBtnPressed = (btns[5] && btns[5].pressed);
          if (yBtnPressed && !menuButtonPressedLastFrame) {
            isMenuOpen = !isMenuOpen;
            if (!isMenuOpen) {
              activeMode = "NONE";
              point1 = null;
              if (previewBoxMesh) previewBoxMesh.visible = false;
              for (var k = 0; k < pointMarkers.length; k++) pointMarkers[k].visible = false;
              restoreAllHitboxesOpacity();
            }
            squareMenuMesh.visible = isMenuOpen;
            updateMenuTexture();
          }
          menuButtonPressedLastFrame = yBtnPressed;

          var xBtnPressed = (btns[4] && btns[4].pressed);
          if (xBtnPressed && !xButtonPressedLastFrame && isMenuOpen) {
            if (activeMode === "NONE") {
              if (selectedMenuIndex === 0) activeMode = "LEVELING";
              else if (selectedMenuIndex === 1) { activeMode = "HITBOX_BUILD"; point1 = null; }
              else if (selectedMenuIndex === 2) activeMode = "HITBOX_LIST";
            } else if (activeMode === "LEVELING" || activeMode === "HITBOX_LIST" || activeMode === "HITBOX_BUILD") {
              activeMode = "NONE";
              point1 = null;
              if (previewBoxMesh) previewBoxMesh.visible = false;
              for (var k = 0; k < pointMarkers.length; k++) pointMarkers[k].visible = false;
              restoreAllHitboxesOpacity();
            } else if (activeMode === "HITBOX_COLOR_EDIT") {
              updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
              activeMode = "HITBOX_LIST";
              restoreAllHitboxesOpacity();
            }
            updateMenuTexture();
          }
          xButtonPressedLastFrame = xBtnPressed;

          if (isMenuOpen && activeMode === "NONE") {
            checkAutoRepeat('menu_nav_up', stickY < -0.5, 300, 150, function() {
              selectedMenuIndex = (selectedMenuIndex - 1 + 3) % 3;
              updateMenuTexture();
            });
            checkAutoRepeat('menu_nav_down', stickY > 0.5, 300, 150, function() {
              selectedMenuIndex = (selectedMenuIndex + 1) % 3;
              updateMenuTexture();
            });
          } 
          else if (isMenuOpen && activeMode === "HITBOX_LIST") {
            if (customHitboxes.length > 0) {
              checkAutoRepeat('list_nav_up', stickY < -0.5, 300, 150, function() {
                selectedHitboxIndex = (selectedHitboxIndex - 1 + customHitboxes.length) % customHitboxes.length;
                updateMenuTexture();
              });
              checkAutoRepeat('list_nav_down', stickY > 0.5, 300, 150, function() {
                selectedHitboxIndex = (selectedHitboxIndex + 1) % customHitboxes.length;
                updateMenuTexture();
              });
            }
          }
          else if (isMenuOpen && activeMode === "HITBOX_COLOR_EDIT") {
            if (!isEditingValue) {
              checkAutoRepeat('sub_nav_up', stickY < -0.6, 300, 150, function() {
                activeSubSelection = Math.max(0, activeSubSelection - 1);
                updateMenuTexture();
              });
              checkAutoRepeat('sub_nav_down', stickY > 0.6, 300, 150, function() {
                activeSubSelection = Math.min(5, activeSubSelection + 1);
                updateMenuTexture();
              });
            } else {
              if (activeSubSelection === 0) {
                checkAutoRepeat('color_left', stickX < -0.5, 300, 120, function() {
                  selectedColorIndex = (selectedColorIndex - 1 + 9) % 9;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                  updateMenuTexture();
                });
                checkAutoRepeat('color_right', stickX > 0.5, 300, 120, function() {
                  selectedColorIndex = (selectedColorIndex + 1) % 9;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                  updateMenuTexture();
                });
              }

              if (activeSubSelection === 1 && Math.abs(stickX) > 0.1) {
                currentOpacity += stickX * 0.015;
                if (currentOpacity < 0.1) currentOpacity = 0.1;
                if (currentOpacity > 1.0) currentOpacity = 1.0;
                updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                updateMenuTexture();
              }

              if (activeSubSelection === 2 && Math.abs(stickX) > 0.1) {
                currentBrightness += stickX * 0.015;
                if (currentBrightness < 0.0) currentBrightness = 0.0;
                if (currentBrightness > 1.0) currentBrightness = 1.0;
                updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, rotX, rotY, rotZ);
                updateMenuTexture();
              }

              if (activeSubSelection === 3) {
                checkAutoRepeat('rotX_left', stickX < -0.3, 250, 40, function() {
                  rotX -= 1; if (rotX < -180) rotX += 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
                checkAutoRepeat('rotX_right', stickX > 0.3, 250, 40, function() {
                  rotX += 1; if (rotX > 180) rotX -= 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
              }

              if (activeSubSelection === 4) {
                checkAutoRepeat('rotY_left', stickX < -0.3, 250, 40, function() {
                  rotY -= 1; if (rotY < -180) rotY += 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
                checkAutoRepeat('rotY_right', stickX > 0.3, 250, 40, function() {
                  rotY += 1; if (rotY > 180) rotY -= 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
              }

              if (activeSubSelection === 5) {
                checkAutoRepeat('rotZ_left', stickX < -0.3, 250, 40, function() {
                  rotZ -= 1; if (rotZ < -180) rotZ += 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
                checkAutoRepeat('rotZ_right', stickX > 0.3, 250, 40, function() {
                  rotZ += 1; if (rotZ > 180) rotZ -= 360;
                  updateHitboxAppearance(selectedHitboxIndex, rainbowPalette[selectedColorIndex].hex, currentOpacity, currentBrightness, Math.round(rotX), Math.round(rotY), Math.round(rotZ));
                  updateMenuTexture();
                });
              }
            }
          }
          else if (isMenuOpen && activeMode === "LEVELING") {
            if (Math.abs(stickY) > 0.1) {
              groundBody.position.y -= stickY * 0.002; 
            }
          } 
          else if (!isMenuOpen) {
            if (Math.abs(stickX) > STICK_DEADZONE) {
              turnValue = stickX;
            } else {
              turnValue = 0;
            }

            if (!isThrottlePressed && !isBrakePressed && Math.abs(stickY) > STICK_DEADZONE) {
              if (stickY < -STICK_DEADZONE) {
                isThrottlePressed = true;
              } else if (stickY > STICK_DEADZONE) {
                isBrakePressed = true;
              }
            }
          }
        }
      }
    }

    if (!isMenuOpen && vehicle) {
      if (isThrottlePressed) {
        currentEngineForce = -maxEngineForce;
        currentBrakingForce = 0;
      } else if (isBrakePressed) {
        currentEngineForce = maxEngineForce * 0.5;
        currentBrakingForce = 0;
      } else {
        currentEngineForce = 0;
        currentBrakingForce = maxBrakeForce;
      }

      currentSteering = -turnValue * maxSteerVal;

      vehicle.applyEngineForce(currentEngineForce, 2);
      vehicle.applyEngineForce(currentEngineForce, 3);

      vehicle.setBrake(currentBrakingForce, 0);
      vehicle.setBrake(currentBrakingForce, 1);
      vehicle.setBrake(currentBrakingForce, 2);
      vehicle.setBrake(currentBrakingForce, 3);

      vehicle.setSteeringValue(currentSteering, 0);
      vehicle.setSteeringValue(currentSteering, 1);
    }

    if (carMesh && chassisBody) {
      carMesh.position.copy(chassisBody.position);
      carMesh.quaternion.copy(chassisBody.quaternion);
    }

    renderer.render(scene, camera);
  }
</script>
